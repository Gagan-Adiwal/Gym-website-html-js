<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - FitLife Gym</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <div class="logo">FitLife</div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="contact.html" class="active btn">Join Now</a></li>
            </ul>
            <div class="menu-toggle" onclick="toggleMenu()">☰</div>
        </nav>
    </header>

    <!-- Contact Section -->
    <section class="contact">
        <h1>Join FitLife Gym Today</h1>
        <p>Fill out the form below and our team will get in touch with you soon.</p>

        <div class="contact-container">
            <form class="contact-form">
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email Address" required>
                <input type="tel" placeholder="Phone Number" required>
                <select>
                    <option>Select Membership Plan</option>
                    <option>Basic - $29/month</option>
                    <option>Standard - $49/month</option>
                    <option>Premium - $79/month</option>
                </select>
                <textarea placeholder="Your Message" rows="5"></textarea>
                <button type="submit" class="btn">Submit</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 FitLife Gym | All Rights Reserved</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
